[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.6.0"
description = "AI-powered stock analysis and valuation platform"
requires-python = ">=3.13"
dependencies = [
    "streamlit==1.63.0",
    "yfinance==1.7.0",
    "pandas==3.0.5",
    "numpy==2.2.6",
    "plotly==7.0.0",
    "scikit-learn==1.9.1",
    "pandas_ta==0.4.71b0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "black==26.5.1",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(\n    \.eggs\n  | \.git\n  | \.venv\n  | build\n  | dist\n  | archive\n  | backup_before_v2\n)/\n'''
