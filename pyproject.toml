[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.6.0"
description = "AI-powered stock analysis and valuation platform"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.32.0",
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "plotly>=5.19.0",
    "scikit-learn>=1.4.1",
    "pandas_ta>=0.3.14b0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.1",
    "black>=24.2.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | archive
  | backup_before_v2
)/
'''
