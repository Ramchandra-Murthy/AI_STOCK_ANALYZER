[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.6.0"
description = "AI-powered stock analysis and valuation platform"
requires-python = ">=3.13"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | archive
  | backup_before_v2
)/
'''