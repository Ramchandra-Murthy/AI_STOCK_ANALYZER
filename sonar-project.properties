sonar.projectKey=Ramchandra-Murthy_AI_STOCK_ANALYZER
sonar.organization=ramchandra-murthy

sonar.sources=.
sonar.tests=tests

sonar.python.version=3.13

sonar.exclusions=\
**/.venv/**,\
**/venv/**,\
**/.venv_wsl/**,\
**/__pycache__/**,\
**/.pytest_cache/**,\
**/.mypy_cache/**,\
**/.ruff_cache/**,\
**/archive/**,\
**/backup_before_v2/**,\
**/tests_legacy/**,\
**/*.bak,\
**/*.backup*

sonar.coverage.exclusions=\
**/tests/**,\
**/tests_legacy/**,\
**/archive/**,\
**/backup_before_v2/**

sonar.python.coverage.reportPaths=coverage.xml