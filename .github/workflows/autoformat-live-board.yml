name: Autoformat live board

on:
  push:
    branches:
      - feature/live-20-stock-board
    paths:
      - modules/intraday.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv sync --locked --dev
      - run: uv run black modules/intraday.py
      - name: Commit formatted file
        run: |
          if git diff --quiet -- modules/intraday.py; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/intraday.py
          git commit -m "Autoformat intraday module"
          git push origin HEAD:${GITHUB_REF_NAME}
