name: Black diff PR69

on:
  workflow_dispatch:

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.1"
      - run: uv sync --locked --no-build --no-install-project
      - run: uv run --locked --no-sync --no-build black --diff --color scanner/eros_regime_persistence.py
