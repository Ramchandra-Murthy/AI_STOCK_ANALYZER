name: Temporary Black Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  black-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eros-regime-breadth
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-build --no-install-project
      - name: Format EROS breadth files
        run: |
          uv run --locked --no-sync --no-build black scanner/eros_regime_breadth.py scanner/eros_master_dashboard.py tests/test_eros_regime_breadth.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/eros_regime_breadth.py scanner/eros_master_dashboard.py tests/test_eros_regime_breadth.py
          git rm .github/workflows/black-diff-temp.yml 2>/dev/null || true
          git rm .github/workflows/black-autofix-temp.yml 2>/dev/null || true
          git commit -m "Apply Black formatting to EROS breadth"
          git push origin HEAD:feature/eros-regime-breadth
