name: Institutional Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
      - run: ruff check .
      - run: mypy --ignore-missing-imports core/ services/
      - run: pytest tests/ --cov=core --cov=services --cov-fail-under=95
