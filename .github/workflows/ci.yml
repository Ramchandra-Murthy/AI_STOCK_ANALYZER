name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "rebuild/**"

  pull_request:
    branches:
      - main
      - develop
      - "rebuild/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: "mypy==1.17.1"
          python -m pip install --no-deps -e .

      - name: Source Compile Audit
        run: |
          python -m compileall -q backend core services api tests

      - name: Ruff
        run: |
          ruff check backend core services api tests

      - name: MyPy
        run: |
          mypy core --ignore-missing-imports

      - name: Pytest
        run: |
          python -m pytest -q
