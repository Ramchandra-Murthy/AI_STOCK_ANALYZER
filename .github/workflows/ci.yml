name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "ruff==0.12.10" "pytest==8.4.1" "mypy==1.17.1"

      - name: Ruff
        run: |
          ruff check .

      - name: MyPy
        run: |
          mypy core --ignore-missing-imports

      - name: Pytest
        run: |
          pytest -q
