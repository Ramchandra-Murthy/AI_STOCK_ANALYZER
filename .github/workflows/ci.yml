name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# EROS: canonical CI gate for the supported repaired runtime surface.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint with Ruff
      run: ruff check .
    - name: Check formatting with Black
      run: black --check .
    - name: Type check supported runtime surface
      run: >-
        mypy
        services/ai_service.py
        services/fundamental_score_service.py
        services/recommendation_service.py
        services/score_service.py
        services/target_price_service.py
        services/technical_score_service.py
        services/trade_plan_service.py
        services/ui_formatters.py
    - name: Test repaired contracts and market-data boundaries
      run: >-
        pytest -q
        tests/test_repaired_contracts.py
        tests/test_market_data_boundary.py

