name: Temporary Black repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip black==26.5.1
      - run: black services/valuation/dcf_engine.py services/valuation/nav_engine.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/valuation/dcf_engine.py services/valuation/nav_engine.py
          git diff --cached --quiet && exit 0
          git commit -m "Format valuation engine adapters with Black"
          git push
