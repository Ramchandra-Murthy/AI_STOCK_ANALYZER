name: React API Container

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - ".dockerignore"
      - "api/**"
      - "scanner/**"
      - "services/**"
      - "modules/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api-container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - ".dockerignore"
      - "api/**"
      - "scanner/**"
      - "services/**"
      - "modules/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build independent React API image
        run: docker build --pull -f Dockerfile.api -t eros-react-api:ci .

      - name: Smoke test FastAPI and React static serving
        run: |
          set -euo pipefail
          docker run -d --rm --name eros-react-api-ci -p 8000:8000 eros-react-api:ci
          trap 'docker logs eros-react-api-ci || true; docker stop eros-react-api-ci || true' EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "FastAPI health endpoint did not become ready"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl --fail --silent http://127.0.0.1:8000/docs >/dev/null
