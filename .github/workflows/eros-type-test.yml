name: EROS Type Test Diagnostics

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: MyPy diagnostics
        run: |
          mypy . > eros-mypy-report.txt 2>&1 || true
          cat eros-mypy-report.txt
      - name: PyTest diagnostics
        run: |
          pytest > eros-pytest-report.txt 2>&1 || true
          cat eros-pytest-report.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eros-mypy-report.txt eros-pytest-report.txt
          git commit -m "Record EROS type and test diagnostics" || exit 0
          git push origin HEAD:main
