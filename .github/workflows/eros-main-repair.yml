name: EROS Main Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff safe fixes
        run: ruff check . --fix || true
      - name: Black formatting
        run: black . || true
      - name: Diagnostics
        run: |
          ruff check . --output-format=concise > eros-ruff-report.txt 2>&1 || true
          black --check . > eros-black-report.txt 2>&1 || true
          cat eros-ruff-report.txt
          cat eros-black-report.txt
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No automatic repair required."
            exit 0
          fi
          git commit -m "Repair EROS CI lint and formatting"
          git push origin HEAD:main
