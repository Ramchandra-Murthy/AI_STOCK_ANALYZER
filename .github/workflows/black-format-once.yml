name: One-time Black formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply Black formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format repository
        run: black .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No Black formatting changes needed."
            exit 0
          fi
          git add -A
          git commit -m "chore: apply Black formatting"
          git push
