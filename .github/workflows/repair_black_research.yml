name: Temporary Black repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Format research service
        run: black services/research_service.py
      - name: Commit formatted file and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/research_service.py .github/workflows/repair_black_research.yml
          git rm .github/workflows/repair_black_research.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Black formatting in research service"
            git push
          fi
