name: EROS Auto Repair

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/eros-3-0-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect Ruff diagnostics
        run: |
          ruff check . --output-format=concise > ruff-report.txt 2>&1 || true
          cat ruff-report.txt

      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true

      - name: Apply Black formatting
        run: black .

      - name: Recheck Ruff
        run: |
          ruff check . --output-format=concise > ruff-report-after.txt 2>&1 || true
          cat ruff-report-after.txt

      - name: Commit diagnostics and repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No automatic repairs or diagnostic changes were produced."
            exit 0
          fi
          git commit -m "Diagnose and auto-repair Ruff and Black violations"
          git push origin HEAD:${GITHUB_REF_NAME}
