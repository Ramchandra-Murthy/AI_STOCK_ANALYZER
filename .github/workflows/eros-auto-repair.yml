name: EROS Auto Repair

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/eros-3-0-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply safe Ruff fixes
        run: ruff check . --fix

      - name: Apply Black formatting
        run: black .

      - name: Verify Ruff
        run: ruff check .

      - name: Verify Black
        run: black --check .

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No automatic repairs were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-repair Ruff and Black violations"
          git push origin HEAD:${GITHUB_REF_NAME}
