# ==========================================================
# Ruff Configuration
# AI Stock Analyzer
# Python 3.13
# ==========================================================

target-version = "py313"
line-length = 100

# Never lint generated or archived code
force-exclude = true

extend-exclude = [
    "archive",
    ".venv",
    "__pycache__",
    "generated_reports",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[lint]

select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

ignore = [
    "E501",   # Long lines
    "B017",   # Blind exception assertions
    "E402",   # Module import not at top
    "F811",   # Redefinition
    "E741",   # Ambiguous variable names
    "F821",   # Undefined names (temporarily)
]

# Package exports
[lint.per-file-ignores]

"**/__init__.py" = [
    "F401",
]

[format]

quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true