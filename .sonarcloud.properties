# SonarQube Cloud automatic-analysis scope for the supported EROS runtime.
# Automatic analysis ignores sonar-project.properties; this file supplies the exclusions it uses.
sonar.exclusions=archive/**,backup_before_v2/**,**/*.bak,**/__pycache__/**,.venv/**,build/**,dist/**
sonar.coverage.exclusions=archive/**,backup_before_v2/**,**/*.bak,tests/**
